<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente de Reuniões</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Assistente de Reuniões</h1>
    <div class="controls">
      <span id="status-indicator" class="status-idle">Ocioso</span>
      <button id="btn-start">Iniciar reunião</button>
      <button id="btn-stop" disabled>Parar reunião</button>
    </div>
  </header>
  <main>
    <aside id="meeting-list"></aside>
    <section id="meeting-detail">
      <p class="empty-state">Selecione uma reunião à esquerda.</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
